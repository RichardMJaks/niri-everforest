config_version = 15

[audio]
sound_theme = "ocean"

[backdrop]
blur_intensity = 0.34999999217689037

[bar.default]
background_opacity = 0.75999998301267624
capsule_fill = "primary"
capsule_foreground = "on_primary"
capsule_thickness = 0.71999998763203621
center = [ "workspaces", "ribbon", "bar", "mirror", "recorder" ]
end = [ "tray", "w-engine-widget", "notifications", "network", "bluetooth", "keybinds", "volume", "battery", "clock" ]
margin_ends = 16
padding = 16
panel_overlap = 0
radius = 32
radius_top_left = 0
radius_top_right = 0
shadow = false
start = [ "control-center", "launcher", "network_rx", "network_tx" ]
thickness = 28
widget_spacing = 12

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "media"

[[control_center.shortcuts]]
type = "yocraft/qrcode:shortcut"

[[control_center.shortcuts]]
type = "system"

[dock]
radius_top_right = 11

[idle]
behavior_order = [ "screen-off", "lock", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 300.0

