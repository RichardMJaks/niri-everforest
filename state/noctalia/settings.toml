[notification]
background_opacity = 0.99999997764825821
border_color = "primary"
border_width = 2.0
layer = "overlay"
position = "bottom_right"

[osd]
background_opacity = 0.99999997764825821
border_color = "primary"
border_width = 1.5
position = "top_right"
position_vertical = "top_right"

[plugin_settings."noctalia/screen_recorder"]
hide_inactive = true
replay_enabled = true

[plugin_settings."tadomika_ari/w-engine"]
sync_colors = false
w-engine-panel_open_near_click = true
w-engine-panel_placement = "attached"

[plugins]
enabled = [
    "noctalia/screen_recorder",
    "kenn/keybind-cheatsheet",
    "rylos/syncthing",
    "ramosdetrigo/godot-provider",
    "yocraft/qrcode",
    "luochen1990/niri-ribbon",
    "abuamar142/qr-share",
    "yangkx/usbeehive",
    "aristides/udiskie",
    "tordex/xwayland",
    "elijaharch/wl-screen-mirror",
    "tadomika_ari/w-engine"
]

[shell]
clipboard_auto_paste = "off"
niri_overview_type_to_launch_enabled = true

    [shell.launcher]
    categories = false
    compact = true

        [shell.launcher.providers.wallpaper]
        prefix = "\\"

    [shell.panel]
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_control_center = true
    open_near_click_launcher = true

    [shell.screenshot]
    remember_last_region = true

    [shell.window_switcher]
    current_workspace_only = true

[theme]
custom_palette = "Nature-Teal"
source = "custom"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kitty", "niri", "qt", "starship" ]
    community_ids = [ "discord", "gimp", "inkscape", "libreoffice", "steam", "obs" ]

[wallpaper]
directory = "/home/rikkss/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/rikkss/Pictures/Wallpapers/futuristic_green.png"

    [wallpaper.last]
    path = "/home/rikkss/Pictures/Wallpapers/futuristic_green.png"

    [wallpaper.monitors.DP-1]
    path = "/home/rikkss/Pictures/Wallpapers/futuristic_green.png"

    [wallpaper.monitors.DP-2]
    path = "/home/rikkss/Pictures/Wallpapers/futuristic_green.png"

    [wallpaper.monitors.DP-3]
    path = "/home/rikkss/Pictures/Wallpapers/futuristic_green.png"

[widget.bar]
enable_scroll = false
hide_on_wayland = false
type = "tordex/xwayland:bar"

[widget.bluetooth]
enabled = false

[widget.clock]
capsule = true
font_family = "Arimo Nerd Font Propo"
font_weight = 700
timezone = "Europe/Tallinn"

[widget.control-center]
capsule = true
glyph = "flask-2-filled"

[widget.keybinds]
type = "kenn/keybind-cheatsheet:keybinds"

[widget.launcher]
capsule = true
capsule_border_width = 0.0
capsule_radius = "auto"
glyph = "braces"

[widget.media]
enabled = false

[widget.mirror]
enable_scroll = false
enabled = false
type = "elijaharch/wl-screen-mirror:mirror"

[widget.network]
show_label = false

[widget.network_rx]
network_speed_compact = true
visualization = "none"

[widget.network_tx]
visualization = "none"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.ribbon]
type = "luochen1990/niri-ribbon:ribbon"

[widget.session]
enabled = false

[widget.tray]
drawer = true
match_adjacent_spacing = true

[widget.volume]
mute_color = "outline"

[widget.w-engine-widget]
type = "tadomika_ari/w-engine:w-engine-widget"

[widget.workspaces]
capsule = true
capsule_border_width = 0.0
capsule_fill = "on_secondary"
capsule_padding = 0
empty_color = "on_primary"
focused_output_only = true
font_family = "0xProto Nerd Font Mono"
font_weight = 700
hide_when_empty = true
occupied_color = "on_primary"