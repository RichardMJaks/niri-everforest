"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"

format = """
╭──── \
❰\
$username\
❱ \
$directory \
$git_branch\
$git_status\
$cmd_duration\
$fill \
(\
$bun\
$c\
$cmake\
$dart\
$dotnet\
$golang\
$gradle\
$java\
$kotlin\
$nodejs\
$lua\
$package\
$php\
$python\
$rlang\
$ruby\
$rust\
$scala\
-)\
$container\
$battery\
$time \
$os \
$linebreak
╰╴\
$status\
$character\
"""

[character]
format = '$symbol '
success_symbol = '[➤](bold green)'
error_symbol = '[➤](bold red)'
vimcmd_symbol = '\[[N](bold white)\]'
vimcmd_replace_one_symbol =' \[[R1](bold orange)\]'
vimcmd_replace_symbol = ' \[[R](bold orange)\]'
vimcmd_visual_symbol = ' \[[V](bold gray)\]'

[username]
show_always=true
format="[$user]($style)"

[hostname]
ssh_only = false
format = "[$hostname$ssh_symbol]($style)"
ssh_symbol = " "

[fill]
symbol = '┄'
style = 'bold black'

[aws]
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[time]
format = '[$time]($style)'
disabled = false
time_format = '%H:%M %F'

[buf]
symbol = " "

[bun]
symbol = " "

[c]
symbol = " "

[cpp]
symbol = " "

[cmake]
symbol = " "

